name: Build Android TV APK

on:
  push:
    branches:
      - agent/android-tv-mvp
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  pull_request:
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p android-tv-app :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-test-debug
          path: android-tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
