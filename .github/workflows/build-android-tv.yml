name: Build Stream TV APK

on:
  push:
    branches:
      - agent/android-tv-mvp
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  pull_request:
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Create isolated development signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore stream-tv-mobile-test.jks \
            -storepass streamtv123 \
            -keypass streamtv123 \
            -alias streamtv-mobile-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Stream TV Mobile Test, OU=Development, O=Yelao, L=Bahia Blanca, ST=Buenos Aires, C=AR'

      - name: Build, align and sign compatibility APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-tv-app :app:assembleRelease --stacktrace --console=plain > build.log 2>&1
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            android-tv-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            Stream-TV-Test-v0.1.3-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks stream-tv-mobile-test.jks \
            --ks-key-alias streamtv-mobile-test \
            --ks-pass pass:streamtv123 \
            --key-pass pass:streamtv123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Stream-TV-Test-v0.1.3-mobile-compatible.apk \
            Stream-TV-Test-v0.1.3-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 Stream-TV-Test-v0.1.3-mobile-compatible.apk >> build.log 2>&1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Stream-TV-Test-v0.1.3-mobile-compatible.apk >> build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compatibility APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-mobile-compatible-v0.1.3
          path: Stream-TV-Test-v0.1.3-mobile-compatible.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: steps.android_build.outcome == 'failure'
        shell: bash
        run: |
          test -f build.log && tail -n 180 build.log || true
          exit 1
