name: Build Stream TV APK

on:
  push:
    branches:
      - agent/android-tv-mvp
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  pull_request:
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Build universal debug APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-tv-app :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          cp android-tv-app/app/build/outputs/apk/debug/app-debug.apk Stream-TV-Test-v0.1.1-universal.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload universal APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-test-universal-v0.1.1
          path: Stream-TV-Test-v0.1.1-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: steps.android_build.outcome == 'failure'
        shell: bash
        run: |
          tail -n 160 build.log
          exit 1
