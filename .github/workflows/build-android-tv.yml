name: Build Stream TV APK

on:
  push:
    branches:
      - agent/android-tv-mvp
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  pull_request:
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Download stable public development key
        shell: bash
        run: |
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' | base64 --decode > testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' | base64 --decode > testkey.x509.pem

      - name: Build and sign universal test APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-tv-app :app:assembleRelease --stacktrace --console=plain > build.log 2>&1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --out Stream-TV-Test-v0.1.2-universal-test.apk \
            android-tv-app/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Stream-TV-Test-v0.1.2-universal-test.apk >> build.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload universal test APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stream-tv-test-universal-v0.1.2
          path: Stream-TV-Test-v0.1.2-universal-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: steps.android_build.outcome == 'failure'
        shell: bash
        run: |
          tail -n 180 build.log
          exit 1
